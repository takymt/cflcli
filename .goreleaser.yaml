version: 2
project_name: cfl

builds:
  - id: cfl
    main: ./cmd/cfl
    binary: cfl
    ldflags:
      - '-s -w -X main.revision={{ .ShortCommit }}'
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

before:
  hooks:
    - go test ./...

archives:
  - formats:
      - tar.gz
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'

signs:
  - artifacts: checksum
    cmd: cosign
    signature: '${artifact}.sig'
    output: true
    args:
      - sign-blob
      - --yes
      - --output-signature
      - ${signature}
      - ${artifact}

sboms:
  - artifacts: archive

brews:
  - ids:
      - cfl
    name: cflcli
    repository:
      owner: takymt
      name: homebrew-tap
      branch: main
      token: '{{ .Env.GH_PAT }}'
    directory: Formula
    homepage: 'https://github.com/takymt/cflcli'
    description: 'Confluence CLI for managing pages with local Markdown files'
    license: MIT
    install: |
      bin.install "cfl"
    test: |
      system "#{bin}/cfl", "--help"
    commit_author:
      name: github-actions[bot]
      email: github-actions[bot]@users.noreply.github.com
    skip_upload: '{{ eq .Env.GH_PAT "" }}'

release:
  github:
    owner: takymt
    name: cflcli
