pre-commit:
  commands:
    fmt:
      run: gofmt -w {staged_files}
    lint:
      run: golangci-lint run --new-from-rev=HEAD --fix=false
    api-version:
      run: bash scripts/api-version.sh

pre-push:
  commands:
    test:
      run: go test ./...

commit-msg:
  commands:
    conventional-commit:
      run: bash scripts/commit-msg.sh {1}
