version: "2"

formatters:
  enable:
    - goimports

linters:
  enable:
    # Bug prevention
    - bodyclose
    - durationcheck
    - depguard
    - errcheck
    - errorlint
    - govet
    - nilerr
    - noctx
    - staticcheck

    # Code quality
    - gocritic
    - ineffassign
    - revive
    - unconvert
    - unused

    # Style
    - errname
    - whitespace

  settings:
    depguard:
      rules:
        no-third-party-http-client:
          files:
            - "$all"
          deny:
            - pkg: github.com/go-resty/resty/v2
              desc: use standard library net/http
            - pkg: github.com/hashicorp/go-retryablehttp
              desc: use standard library net/http
            - pkg: github.com/imroc/req/v3
              desc: use standard library net/http
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
    revive:
      rules:
        - name: exported
