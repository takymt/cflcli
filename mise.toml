[tools]
go = "1.26.0"
golangci-lint = "2.9.0"
lefthook = "2.1.1"
"go:github.com/x-motemen/gobump/cmd/gobump" = "0.3.0"

[tasks.build]
run = "go build -o cfl ."

[tasks.test]
run = "go test ./..."

[tasks.fmt]
run = "gofmt -w ."

[tasks.lint]
run = "golangci-lint run ./..."

[tasks.clean]
run = "rm -rf cfl dist"

[tasks.all]
run = ["mise run fmt", "mise run lint", "mise run test", "mise run build"]

[tasks.bump]
run = "gobump patch -w ."

[tasks.hooks]
run = "lefthook install"
