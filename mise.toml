[tools]
go = "1.26.0"
golangci-lint = "2.9.0"
lefthook = "2.1.1"
"go:github.com/x-motemen/gobump/cmd/gobump" = "0.3.0"

[tasks.build]
run = "go build -o cfl ./cmd/cfl"

[tasks.test]
run = "go test ./..."

[tasks.cover]
run = "go test -cover ./cmd/... ./internal/..."

[tasks.fmt]
run = "gofmt -w ."

[tasks.lint]
run = ["golangci-lint run ./...", "bash scripts/api-version.sh"]

[tasks.clean]
run = "rm -rf cfl dist"

[tasks.all]
run = ["mise run build", "mise run fmt", "mise run lint", "mise run test"]

[tasks.bump]
run = "bash scripts/bump.sh"

[tasks.bump-version]
run = "gobump patch -w ./cmd"

[tasks.hooks]
run = "lefthook install"
