[tools]
go = "1.26.0"
golangci-lint = "2.9.0"
lefthook = "2.1.1"
"go:github.com/x-motemen/gobump/cmd/gobump" = "0.3.0"

[tasks.build]
run = "go build -o cfl ."

[tasks.test]
run = "go test ./..."

[tasks.test-it]
run = "go test -tags=integration ./internal/integration"

[tasks.test-live]
run = "CFL_LIVE=1 go test -tags=integration ./internal/integration -run Live"

[tasks.cover]
run = "go test -cover ./cmd/... ./internal/..."

[tasks.fmt]
run = "gofmt -w ."

[tasks.lint]
run = "golangci-lint run ./..."

[tasks.clean]
run = "rm -rf cfl dist"

[tasks.all]
run = ["mise run build", "mise run fmt", "mise run lint", "mise run test"]

[tasks.bump]
run = "gobump patch -w ."

[tasks.hooks]
run = "lefthook install"
